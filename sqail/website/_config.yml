theme: just-the-docs
url: "https://sqail.tsel.ai"

# Analytics configuration
analytics:
  enabled: false  # Single switch to control analytics and cookie consent
  posthog_key: ''
  posthog_host: 'https://us.i.posthog.com'

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-feed

defaults:
  - scope:
      path: "README.md"
      type: "pages"
    values:
      description: "sqail is SQL AI pair programming in your terminal"

exclude:
  - "tmp*"
  - "**/tmp*"
  - OLD
  - "**/OLD/**"
  - "OLD/**"
  - vendor
  - feed.xml

aux_links:
  "GitHub":
    - "https://github.com/Florents-Tselai/sqail"
  "Discord":
    - "https://discord.gg/XXXXXX"
  "Blog":
    - "/blog/"

nav_external_links:
  - title: "GitHub"
    url: "https://github.com/Florents-Tselai/sqail"
  - title: "Discord"
    url: "https://discord.gg/XXXXXX"

repository: Florents-Tselai/sqail

callouts:
  tip:
    title: Tip
    color: green
  note:
    title: Note
    color: yellow

# Custom CSS for our table of contents
kramdown:
  syntax_highlighter_opts:
    css_class: highlight

sass:
  style: compressed

# Additional CSS
compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []

